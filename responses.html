<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Response Assistant · Restaurant Review Intelligence</title>
  <link rel="stylesheet" href="assets/css/app.css?v=1.6">
</head>
<body>
<header>
  <div>
    <h1>Restaurant Review Intelligence</h1>
    <div class="header-sub">Customer feedback → operational action</div>
  </div>
  <nav>
    <a href="index.html">Overview</a>
    <a href="reviews.html">Review Explorer</a>
    <a class="active" href="responses.html">Response Assistant</a>
    <a href="weekly_report.html">Weekly Report</a>
  </nav>
</header>

<main>
  <div class="hero">
    <div>
      <div class="eyebrow">Owner workflow</div>
      <h1>Review Response Assistant</h1>
      <p class="sub">Draft responses only. Nothing is posted automatically.</p>
    </div>
  </div>

  <div class="card section">
    <div class="filters">
      <select id="category">
        <option value="">All categories</option>
      </select>
      <select id="rating">
        <option value="">All negative ratings</option>
        <option value="1">1 star</option>
        <option value="2">2 stars</option>
      </select>
      <input id="q" type="search" placeholder="Search review text">
    </div>
    <div id="count" class="review-count"></div>
    <div id="responses"></div>
  </div>
</main>

<script src="assets/js/responses.js?v=1.6"></script>
</body>
</html>
