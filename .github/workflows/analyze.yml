name: Restaurant review intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Analyze reviews
        run: python scripts/pipeline.py
      - name: Optional AI owner brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/ai_advisor.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json alerts.json response_drafts.json weekly_report.md weekly_report.html reports/ || true
          git diff --cached --quiet || (git commit -m "Weekly restaurant intelligence update" && git push)
